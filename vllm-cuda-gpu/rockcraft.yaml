# Based on https://github.com/vllm-project/vllm/blob/v0.32.0/docker/Dockerfile
# See ../CONTRIBUTING.md for more details about the patterns used in this rock.

name: vllm-cuda-gpu
summary: vLLM inference engine (GPU/CUDA)
description: "vLLM v0.32.0 OpenAI-compatible inference server for NVIDIA GPUs."
version: "0.32.0"
license: Apache-2.0
base: ubuntu@24.04
run-user: _daemon_

platforms:
  amd64:

# Top-level env is written to OCI config.Env (used by NVIDIA runtime hooks).
# Keep paths fully expanded: rockcraft forbids '$' interpolation here.
environment:
  VIRTUAL_ENV: "/opt/venv"
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  # Make CUDA/NVIDIA tools and libs available in plain shells and hooks.
  PATH: "/opt/venv/bin:/usr/local/nvidia/bin:/usr/local/cuda-13.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  CUDA_HOME: "/usr/local/cuda"
  # Prefer host-mounted driver libraries and expose CUDA libraries for JIT compilation.
  LD_LIBRARY_PATH: "/usr/local/nvidia/lib64:/usr/local/cuda-13.0/lib64:/usr/local/nvidia/lib"
  CXX: "g++-13"
  CC: "gcc-13"
  HF_HOME: "/tmp/huggingface"
  HF_HUB_DISABLE_TELEMETRY: "1"
  CUDA: "13.0"
  CUDA_VERSION: "13.0.3"
  VLLM_ENABLE_CUDA_COMPATIBILITY: "0"
  # vLLM looks here when NCCL is vendored via PyPI wheels.
  VLLM_NCCL_SO_PATH: "/opt/venv/lib/python3.12/site-packages/nvidia/nccl/lib/libnccl.so.2"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"

services:
  vllm:
    override: replace
    summary: "vLLM serve (GPU/CUDA)"
    startup: enabled
    # Pass the model (and any other flags) after the image name, e.g.:
    #   docker run --gpus all vllm-cuda-gpu:0.32.0 --model facebook/opt-125m
    # /opt/venv/bin/vllm is a wrapper (symlink -> /opt/pebble/vllmd.sh) that
    # optionally enables Pebble log forwarding (when LOKI_URL is set) and then
    # execs the real vllm binary (vllm-original). `serve` is fixed here; the
    # bracketed args are the overridable defaults.
    command: "/opt/venv/bin/vllm serve [ --model dummy-model ]"

entrypoint-service: vllm

parts:
  security-team-requirement:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
      dpkg-query --root=${CRAFT_PROJECT_DIR}/../bundles/ubuntu-24.04/rootfs/ -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) \
      > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query

  log-forwarding:
    # Pebble log-forwarding assets: a log-targets layer template and the
    # service wrapper (vllmd.sh) that renders it and runs `pebble add logging`
    # when LOKI_URL is set. Source files live in ./pebble/.
    plugin: nil
    override-build: |
      set -eux
      mkdir -p ${CRAFT_PART_INSTALL}/opt/pebble
      cp ${CRAFT_PROJECT_DIR}/pebble/log-layer.yaml ${CRAFT_PART_INSTALL}/opt/pebble/log-layer.yaml
      cp ${CRAFT_PROJECT_DIR}/pebble/vllmd.sh ${CRAFT_PART_INSTALL}/opt/pebble/vllmd.sh
      chmod +x ${CRAFT_PART_INSTALL}/opt/pebble/vllmd.sh

  vllm:
    plugin: nil
    after: [log-forwarding]
    overlay-packages:
      # Runtime libraries commonly required by vLLM / PyTorch / CV stacks.
      - ca-certificates
      - ffmpeg
      - libglib2.0-0
      - libgl1
      - libibverbs-dev
      - libnuma-dev
      - libnuma1
      - libsm6
      - libxext6
      - gcc-13
      - g++-13
      - numactl
    build-packages:
      - build-essential
      - ca-certificates
      - curl
      - git
      - wget
    build-environment:
      - CUDA: "13.0"
      - CUDA_VERSION: "13.0.3"
    override-build: |
      set -eux -o pipefail

      # Per-architecture CUDA repo selection (keep it here for completeness, even though the current image only targets amd64).
      # NVIDIA publishes the apt repo under x86_64 for amd64 and sbsa for arm64.
      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) CUDA_REPO_ARCH="x86_64" ;;
        arm64) CUDA_REPO_ARCH="sbsa" ;;
        *) echo "Unsupported architecture: ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac

      # CUDA repo & minimal runtime
      wget "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/${CUDA_REPO_ARCH}/cuda-keyring_1.1-1_all.deb"
      dpkg -i cuda-keyring_1.1-1_all.deb
      apt-get -yq update
      # Match vLLM 0.32's CUDA 13.0 runtime and include the compiler and headers
      # required by runtime JIT compilation (FlashInfer, DeepGEMM and EP kernels).
      apt-get -yq install --no-install-recommends \
        cuda-compat-13-0=580.196.07-1ubuntu1 \
        cuda-cudart-13-0=13.0.96-1 \
        cuda-nvcc-13-0=13.0.88-1 \
        cuda-nvrtc-13-0=13.0.88-1 \
        cuda-nvrtc-dev-13-0=13.0.88-1 \
        cuda-cuobjdump-13-0=13.0.85-1 \
        libcurand-dev-13-0=10.4.0.35-1 \
        libcublas-dev-13-0=13.0.2.14-1 \
        cuda-toolkit-13-0-config-common=13.0.96-1 \
        cuda-toolkit-13-config-common=13.0.96-1 \
        cuda-toolkit-config-common=13.0.96-1

      # Promote CUDA tree into the primed image.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/local"
      cp -a /usr/local/cuda-13.0 "${CRAFT_PART_INSTALL}/usr/local/"

      # Mount targets for NVIDIA runtime-injected libs/tools.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/local/nvidia/bin"
      mkdir -p "${CRAFT_PART_INSTALL}/usr/local/nvidia/lib"
      mkdir -p "${CRAFT_PART_INSTALL}/usr/local/nvidia/lib64"

      # Keep an unversioned CUDA path available.
      ln -sf /usr/local/cuda-13.0 "${CRAFT_PART_INSTALL}/usr/local/cuda"

      # NOTE: Do NOT register the compat path in ld.so.conf.d and do NOT symlink
      # the compat libcuda.so.1 into /usr/lib/*-linux-gnu/. The NVIDIA Container
      # Runtime bind-mounts the host's matching libcuda.so.1; a baked-in copy
      # would shadow it and cause driver/kernel version mismatches.

      apt-get clean
      rm -rf /var/lib/apt/lists/*

      # uv installation
      # Use a uv-managed Python 3.12 so the interpreter and venv can be
      # promoted together into the rock.
      which uv > /dev/null 2>&1 || (curl -LsSf https://astral.sh/uv/install.sh | sh)
      ln -sf /root/.local/bin/uv /usr/local/bin/uv
      export PATH="/root/.local/bin:$PATH"

      export UV_PYTHON_INSTALL_DIR=/opt/uv/python
      export VIRTUAL_ENV=/opt/venv
      uv venv --python 3.12 --seed ${VIRTUAL_ENV}
      export PATH="${VIRTUAL_ENV}/bin:$PATH"

      # pip / uv settings 
      export UV_HTTP_TIMEOUT=500
      export UV_INDEX_STRATEGY="unsafe-best-match"
      export UV_LINK_MODE="copy"
      # CUDA wheel index (cu130 == CUDA 13.0).
      # See https://pytorch.org/get-started/locally/#start-locally for the official PyTorch CUDA wheel index URLs.
      export TORCH_CUDA_INDEX_URL="https://download.pytorch.org/whl/cu130"
      # Match the NCCL version used by the vLLM 0.32 CUDA image.
      printf 'nvidia-nccl-cu13==2.30.7\n' > /tmp/uv-overrides.txt
      export UV_OVERRIDE=/tmp/uv-overrides.txt

      # Install the prebuilt vLLM CUDA wheel.
      # The wheel pulls its CUDA runtime via the nvidia-*-cu13 PyPI packages.
      uv pip install --no-cache -v \
        --index-strategy unsafe-best-match \
        --extra-index-url "${TORCH_CUDA_INDEX_URL}" \
        "vllm==0.32.0"
      uv cache clean

      # Install the version-matched precompiled FlashInfer kernels.
      PIP_CACHE_DIR=/opt/pip/cache vllm download-kernels

      # vllm-openai server extras (match the official published image)
      uv pip install --no-cache -v \
        --index-strategy unsafe-best-match \
        --extra-index-url "${TORCH_CUDA_INDEX_URL}" \
        accelerate \
        hf_transfer \
        "modelscope<1.38" \
        "bitsandbytes>=0.46.1" \
        "timm>=1.0.17" \
        "runai-model-streamer[s3,gcs,azure]>=0.15.7"
      uv cache clean

      # NIXL (https://github.com/ai-dynamo/nixl) is required for llm-d's
      # disaggregated prefill/decode KV cache transfer connector.
      # vLLM 0.32 pins NIXL 1.5.0 for its CUDA 13 image.
      uv pip freeze > /tmp/kv-installed.txt
      grep -E '^(torch|torchaudio|torchvision|triton|cuda-bindings|cuda-python|cuda-toolkit)==' \
        /tmp/kv-installed.txt > /tmp/kv-constraints.txt
      uv pip install --no-cache -v \
        --constraint /tmp/kv-constraints.txt "nixl==1.5.0"
      rm -f /tmp/kv-installed.txt /tmp/kv-constraints.txt
      uv cache clean

      # Pin fastapi to <0.137.0 to avoid incompatibility with prometheus-fastapi-instrumentator 8.0.0.
      # fastapi>=0.137.0 introduces _IncludedRouter in app.routes, which lacks a .path attribute
      # and causes the prometheus middleware to crash with AttributeError on every request.
      uv pip install --no-cache "fastapi[standard]>=0.133.0,<0.137.0"

      # Promote Python interpreter + venv into the prime image
      # The absolute paths must match (/opt/uv/python, /opt/venv) so that all
      # symlinks inside the venv continue to resolve correctly inside the rock.
      mkdir -p "${CRAFT_PART_INSTALL}/opt"
      cp -ar /opt/uv  "${CRAFT_PART_INSTALL}/opt/uv"
      cp -ar /opt/venv "${CRAFT_PART_INSTALL}/opt/venv"

      # Mock the vllm executable so `vllm serve ...` (the upstream image
      # entrypoint and KServe manifests) routes through the Pebble service
      # wrapper before the real binary. Preserve the real binary as
      # vllm-original and replace /opt/venv/bin/vllm with a symlink to
      # /opt/pebble/vllmd.sh (provided by the log-forwarding part). Because
      # /opt/venv/bin is first on PATH, every `vllm` call hits the wrapper.
      mv "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm" "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm-original"
      chmod +x "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm-original"
      ln -sf /opt/pebble/vllmd.sh "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm"

      rm -rf /root/.cache
