# Based on https://github.com/vllm-project/vllm/blob/v0.32.0/docker/Dockerfile.cpu
# See ../CONTRIBUTING.md for more details about the patterns used in this rock.

name: vllm-cpu
summary: vLLM inference engine (CPU-only)
description: "vLLM v0.32.0 inference server for CPU platform (x86_64)."
version: "0.32.0"
license: Apache-2.0
base: ubuntu@22.04
platforms:
  amd64:

run-user: _daemon_

environment:
  VIRTUAL_ENV: "/opt/venv"
  PATH: "/opt/binutils/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  COMPILER_PATH: "/opt/binutils/bin"
  HF_HOME: "/tmp/huggingface"
  HF_HUB_DISABLE_TELEMETRY: "1"
  CXX: "g++-15"
  CC: "gcc-15"
  LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4:/opt/venv/lib/libiomp5.so"

services:
  vllm:
    override: replace
    summary: "vLLM serve (CPU)"
    startup: enabled
    # Pass the model (and any other flags) after the image name, e.g.:
    #   docker run vllm-cpu:0.32.0 --model facebook/opt-125m
    # /opt/venv/bin/vllm is a wrapper (symlink -> /opt/pebble/vllmd.sh) that
    # optionally enables Pebble log forwarding (when LOKI_URL is set) and then
    # execs the real vllm binary (vllm-original). `serve` is fixed here; the
    # bracketed args are the overridable defaults.
    command: "/opt/venv/bin/vllm serve [ --model dummy-model ]"
    

entrypoint-service: vllm

package-repositories:
  - type: apt
    ppa: ubuntu-toolchain-r/test
    priority: always

parts:
  security-team-requirement:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
      dpkg-query --root=${CRAFT_PROJECT_DIR}/../bundles/ubuntu-22.04/rootfs/ -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) \
      > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query

  log-forwarding:
    # Pebble log-forwarding assets: a log-targets layer template and the
    # service wrapper (vllmd.sh) that renders it and runs `pebble add logging`
    # when LOKI_URL is set. Source files live in ./pebble/.
    plugin: nil
    override-build: |
      set -eux
      mkdir -p ${CRAFT_PART_INSTALL}/opt/pebble
      cp ${CRAFT_PROJECT_DIR}/pebble/log-layer.yaml ${CRAFT_PART_INSTALL}/opt/pebble/log-layer.yaml
      cp ${CRAFT_PROJECT_DIR}/pebble/vllmd.sh ${CRAFT_PART_INSTALL}/opt/pebble/vllmd.sh
      chmod +x ${CRAFT_PART_INSTALL}/opt/pebble/vllmd.sh

  vllm:
    plugin: nil
    after: [log-forwarding]
    source: https://github.com/vllm-project/vllm.git
    source-tag: v0.32.0

    build-packages:
      - bison
      - build-essential
      - ccache
      - curl
      - flex
      - gcc-15
      - g++-15
      - git
      - libnuma-dev
      - make
      - texinfo
      - xz-utils

    overlay-packages:
      # Runtime libraries needed by vLLM / PyTorch
      - ca-certificates
      - ffmpeg
      - gcc-15
      - g++-15
      - libglib2.0-0
      - libgl1
      - libnuma1
      - libtcmalloc-minimal4
      - libsm6
      - libxext6

    override-build: |
      set -eux

      # Match the compiler and assembler used by vLLM's CPU Dockerfile.
      update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 10 \
        --slave /usr/bin/g++ g++ /usr/bin/g++-15
      export CC=/usr/bin/gcc-15
      export CXX=/usr/bin/g++-15
      export CCACHE_DIR=/root/.cache/ccache
      export CMAKE_CXX_COMPILER_LAUNCHER=ccache

      # vLLM 0.32 enables AMX-FP8, which requires a newer assembler.
      BINUTILS_VERSION=2.47
      curl -fsSLO "https://sourceware.org/pub/binutils/releases/binutils-${BINUTILS_VERSION}.tar.xz"
      tar -xf "binutils-${BINUTILS_VERSION}.tar.xz"
      mkdir binutils-build
      (
        cd binutils-build
        ../binutils-${BINUTILS_VERSION}/configure \
          --prefix=/opt/binutils --disable-nls --disable-werror
        make -j"${MAX_JOBS:-$(nproc)}"
        make install
      )
      rm -rf binutils-build "binutils-${BINUTILS_VERSION}" "binutils-${BINUTILS_VERSION}.tar.xz"
      export PATH="/opt/binutils/bin:/root/.local/bin:$PATH"
      export COMPILER_PATH="/opt/binutils/bin"

      # uv 
      which uv > /dev/null 2>&1 || (curl -LsSf https://astral.sh/uv/install.sh | sh)
      ln -sf /root/.local/bin/uv /usr/local/bin/uv
      export PATH="/root/.local/bin:$PATH"

      # Python 3.12 virtual environment via uv
      # Ubuntu 22.04 does not ship python3.12 in the default repos; uv
      # downloads a portable Python 3.12 build automatically.
      export UV_PYTHON_INSTALL_DIR=/opt/uv/python
      export VIRTUAL_ENV=/opt/venv
      uv venv --python 3.12 --seed ${VIRTUAL_ENV}
      export PATH="${VIRTUAL_ENV}/bin:$PATH"

      # Install the CPU runtime dependencies and build dependencies from the
      # same requirements files used by the upstream CPU image.
      export UV_HTTP_TIMEOUT=500
      export UV_INDEX_STRATEGY="unsafe-best-match"
      export UV_LINK_MODE="copy"

      uv pip install --no-cache -v \
        --index-strategy unsafe-best-match --torch-backend cpu \
        -r requirements/cpu.txt
      uv cache clean

      uv pip install --no-cache -v \
        --index-strategy unsafe-best-match --torch-backend cpu \
        -r requirements/build/rust.txt
      uv cache clean

      uv pip install --no-cache -v \
        --index-strategy unsafe-best-match --torch-backend cpu \
        -r requirements/build/cpu.txt
      uv cache clean

      # Build and package the Rust frontend as in the upstream CPU image.
      export CARGO_BUILD_JOBS=4
      bash tools/build_rust.sh

      # Build vLLM wheel (CPU)
      export VLLM_TARGET_DEVICE=cpu
      export MAX_JOBS=${MAX_JOBS:-$(nproc)}
      export CMAKE_ARGS="-DENABLE_AMX_FP8=1"

      python setup.py bdist_wheel --dist-dir=dist --py-limited-api=cp38

      # Install built wheel
      uv pip install --no-cache dist/vllm-0.32.0*.whl
      uv cache clean

      # Promote Python interpreter + venv into the prime image
      # The absolute paths must match (/opt/uv/python, /opt/venv) so that all
      # symlinks inside the venv continue to resolve correctly inside the rock.
      mkdir -p "${CRAFT_PART_INSTALL}/opt"
      cp -ar /opt/uv  "${CRAFT_PART_INSTALL}/opt/uv"
      cp -ar /opt/venv "${CRAFT_PART_INSTALL}/opt/venv"
      cp -ar /opt/binutils "${CRAFT_PART_INSTALL}/opt/binutils"

      # Mock the vllm executable so `vllm serve ...` (the upstream image
      # entrypoint and KServe manifests) routes through the Pebble service
      # wrapper before the real binary. Preserve the real binary as
      # vllm-original and replace /opt/venv/bin/vllm with a symlink to
      # /opt/pebble/vllmd.sh (provided by the log-forwarding part). Because
      # /opt/venv/bin is first on PATH, every `vllm` call hits the wrapper.
      mv "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm" "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm-original"
      chmod +x "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm-original"
      ln -sf /opt/pebble/vllmd.sh "${CRAFT_PART_INSTALL}/opt/venv/bin/vllm"
